<!-- SUBJECT: Payment received for {{order_number}} -->
<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#3a2420;margin:0 0 16px;line-height:1.7;">
  Hi {{customer_name}}, we've received your payment for order <strong>{{order_number}}</strong>.
</p>
<table width="100%" cellpadding="0" cellspacing="0" style="background:rgba(169,201,160,0.2);border:1px solid rgba(124,148,115,0.4);border-radius:12px;">
  <tr>
    <td style="padding:16px 20px;text-align:center;">
      <p style="margin:0 0 4px;font-family:Arial,Helvetica,sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#22391f;">Amount Paid</p>
      <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:700;color:#22391f;">{{order_total}}</p>
    </td>
  </tr>
</table>
<p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#8a7a63;margin-top:20px;">— {{store_name}}</p>

<!-- SUBJECT: Your order {{order_number}} has shipped -->
<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#3a2420;margin:0 0 16px;line-height:1.7;">
  Hi {{customer_name}}, your order <strong>{{order_number}}</strong> is on its way!
</p>
{{#if tracking_number}}
<table width="100%" cellpadding="0" cellspacing="0" style="background:#fbf6ee;border:1px solid #e8dcc4;border-radius:12px;margin-bottom:16px;">
  <tr>
    <td style="padding:16px 20px;text-align:center;">
      <p style="margin:0 0 4px;font-family:Arial,Helvetica,sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8a7a63;">Tracking Number</p>
      <p style="margin:0;font-family:'Courier New',Courier,monospace;font-size:18px;font-weight:700;color:#c1502e;letter-spacing:1px;">{{tracking_number}}</p>
    </td>
  </tr>
</table>
{{/if}}
<p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#8a7a63;">— {{store_name}}</p>
